<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>きょう、なにする？</title>
    <script>
      // 描画前にテーマを反映して、白背景選択時のちらつきを防ぐ（src/hooks/useTheme.ts と同じキー）
      try {
        if (JSON.parse(localStorage.getItem("yaritaikoto.theme.v1")) === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {
        // 読めなければ既定（暗いネイビー）のまま
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
